version: '3.8'

services:
  db:
    image: postgres:13
    container_name: candidatos-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "090407"
      POSTGRES_DB: candidatos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - candidatos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: candidatos-backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - DOCKER_ENV=true
      - DB_HOST=db
      - DB_NAME=candidatos_db
      - DB_USER=postgres
      - DB_PASSWORD=090407
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - candidatos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: candidatos-frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - candidatos-network

networks:
  candidatos-network:
    driver: bridge

volumes:
  postgres_data: